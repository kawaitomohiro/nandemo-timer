<!-- ══════ タイマー画面 ══════ -->
<div id="timer-screen">

      <button class="btn-cancel-d" onclick="closePublishDialog()">やめる</button>
    </div>
  </div>
</div>

<script>
window.__WEB__ = true;
(function(){
  var KEY = 'nandemo_timer_my_v1';
  function load(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : []; }catch(e){ return []; } }
  function save(v){ localStorage.setItem(KEY, JSON.stringify(v || [])); }
  var API = {
    getMyTimers: function(){ return load(); },
    setMyTimers: function(t){ save(t); return true; },
    getSharedTimers: function(){ return []; },
    setSharedTimers: function(){ throw new Error('みんな用はGoogle版で使えます'); }
  };
  function runner(ok, ng){
    var r = {
      withSuccessHandler: function(f){ return runner(f, ng); },
      withFailureHandler: function(f){ return runner(ok, f); }
    };
    Object.keys(API).forEach(function(k){
      r[k] = function(){
        var a = arguments;
        setTimeout(function(){
          try { var v = API[k].apply(null, a); if (ok) ok(v); }
          catch(e){ if (ng) ng(e); }
        }, 0);
      };
    });
    return r;
  }
  window.google = { script: { run: runner(null, null) } };
})();
</script>

      btnLabel: '🌇 帰りの会スタート', finishMsg: 'さようなら！',
      phases: [
        { label: '振り返り終わりまで…', minutes: 5 },
        { label: '連絡終わりまで…',     minutes: 3 },
        { label: 'さようならまで…',     minutes: 2 },
      ]
    },
  ];

  // ── 状態 ─────────────────────────────────────
  let PHASES = [{ label: 'フェーズ１', minutes: 5 }];
  const BG_CLASSES = [
    'phase-0','phase-1','phase-2','phase-3','phase-4',
    'phase-5','phase-6','phase-7','phase-8','phase-9'
  ];

  let startBtnLabel  = '▶ スタート';
  let finishMsg      = 'おわり！';
  let dispMode       = 'number';
  let soundMode      = 'none';
  let activePresetId = 'free';

  let phaseIndex = 0;
  let remaining  = 0;
  let totalSecs  = 0;
  let intervalId = null;
  let paused     = false;

  // ── 保存タイマー ─────────────────────────────
  let sharedTimers = [];   // みんな用（ScriptProperties）
  let myTimers     = [];   // 自分用（UserProperties）
  let currentTab   = 'mine';
  let publishIndex = -1;   // 公開しようとしているタイマーのindex

  // ── DOM ──────────────────────────────────────
  const elLabel         = document.getElementById('phase-label');
  const elTimer         = document.getElementById('timer');
  const elCircleWrap    = document.getElementById('circle-wrap');
  const elCircleProg    = document.getElementById('circle-prog');
  const elSecretIcon    = document.getElementById('secret-icon');
  const elFinish        = document.getElementById('finish-msg');
  const elStart         = document.getElementById('btn-start');
  const elPause         = document.getElementById('btn-pause');
  const elReset         = document.getElementById('btn-reset');
  const elBtnSetting    = document.getElementById('btn-setting');
  const elBtnSavedList  = document.getElementById('btn-saved-list');
  const elTimerScreen   = document.getElementById('timer-screen');
  const elSettingScreen = document.getElementById('setting-screen');
  const elSavedScreen   = document.getElementById('saved-screen');
  const elSavedList     = document.getElementById('saved-list');

  const CIRCUMFERENCE = 2 * Math.PI * 44;

  // ══════════════════════════════════════════════
  //  サーバーとのやりとり
  // ══════════════════════════════════════════════

  // --- みんな用 ---
  function loadSharedTimers(callback) {
    google.script.run
      .withSuccessHandler(function(data) {
        sharedTimers = data || [];
        if (callback) callback();
      })
      .withFailureHandler(function(err) {
        console.log('みんな用の読み込み失敗:', err);
        sharedTimers = [];
        if (callback) callback();
      })
      .getSharedTimers();
  }

  function saveSharedTimers(callback) {
    google.script.run
      .withSuccessHandler(function() { if (callback) callback(); })
      .withFailureHandler(function(err) { alert('みんな用の保存に失敗しました'); })
      .setSharedTimers(sharedTimers);
  }

  // --- 自分用 ---
  function loadMyTimers(callback) {
    google.script.run
      .withSuccessHandler(function(data) {
        myTimers = data || [];
        if (callback) callback();
      })
      .withFailureHandler(function(err) {
        console.log('自分用の読み込み失敗:', err);
        myTimers = [];
        if (callback) callback();
      })
      .getMyTimers();
  }

  function saveMyTimers(callback) {
    google.script.run
      .withSuccessHandler(function() { if (callback) callback(); })
      .withFailureHandler(function(err) { alert('自分用の保存に失敗しました'); })
      .setMyTimers(myTimers);
  }

  // 起動時に両方読み込む
  loadSharedTimers();
  loadMyTimers();

  // ══════════════════════════════════════════════
  //  音
  // ══════════════════════════════════════════════
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, vol, delay) {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.35;
    const t = ctx.currentTime + (delay || 0);
    osc.start(t); osc.stop(t + dur);
  }
  function playPhaseChange() {
    if (soundMode === 'none') return;
    beep(880, 0.12, 0.35, 0);
    beep(1100, 0.12, 0.35, 0.18);
    beep(1320, 0.25, 0.35, 0.36);
  }
  function playOneMin() {
    if (soundMode !== 'phase+1min') return;
    beep(660, 0.1, 0.3, 0);
    beep(660, 0.1, 0.3, 0.2);
  }
  function playFinish() {
    if (soundMode === 'none') return;
    [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.25, 0.45, i * 0.2));
  }

  // ══════════════════════════════════════════════
  //  表示モード
  // ══════════════════════════════════════════════
  function applyDispMode() {
    elTimer.style.display      = dispMode === 'number' ? 'block' : 'none';
    elCircleWrap.style.display = dispMode === 'circle' ? 'flex'  : 'none';
    elSecretIcon.style.display = dispMode === 'secret' ? 'block' : 'none';
  }

  function updateCircle() {
    if (dispMode !== 'circle') return;
    const ratio  = totalSecs > 0 ? remaining / totalSecs : 0;
    const offset = CIRCUMFERENCE * (1 - ratio);
    elCircleProg.style.strokeDashoffset = offset;
    elCircleProg.style.stroke =
      ratio > 0.3 ? '#66bb6a' : ratio > 0.1 ? '#ffa726' : '#ef5350';
  }

  // ══════════════════════════════════════════════
  //  タイマー動作
  // ══════════════════════════════════════════════
  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function startPhase(index) {
    phaseIndex = index;
    remaining  = PHASES[index].minutes * 60;
    totalSecs  = remaining;
    document.body.className = BG_CLASSES[index % BG_CLASSES.length];
    elLabel.textContent     = PHASES[index].label;
    elTimer.textContent     = fmt(remaining);
    elCircleProg.style.strokeDashoffset = 0;
    updateCircle();
    clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
  }

  function tick() {
    if (paused) return;
    remaining--;
    elTimer.textContent = fmt(remaining);
    updateCircle();
    if (remaining === 60) playOneMin();
    if (remaining <= 0) { clearInterval(intervalId); nextPhase(); }
  }

  function nextPhase() {
    const next = phaseIndex + 1;
    if (next < PHASES.length) {
      playPhaseChange();
      startPhase(next);
    } else {
      playFinish();
      document.body.className    = 'phase-end';
      elLabel.style.display      = 'none';
      elTimer.style.display      = 'none';
      elCircleWrap.style.display = 'none';
      elSecretIcon.style.display = 'none';
      elFinish.textContent       = finishMsg;
      elFinish.style.display     = 'block';
      elPause.style.display      = 'none';
      elReset.style.display      = 'inline-block';
    }
  }

  function startTimer() {
    getCtx();
    elStart.style.display        = 'none';
    elPause.style.display        = 'inline-block';
    elReset.style.display        = 'inline-block';
    elBtnSetting.style.display   = 'none';
    elBtnSavedList.style.display = 'none';
    applyDispMode();
    playPhaseChange();
    startPhase(0);
  }

  function togglePause() {
    paused = !paused;
    elPause.textContent = paused ? '▶ 再開' : '⏸ 一時停止';
  }

  function resetTimer() {
    clearInterval(intervalId);
    paused = false;
    document.body.className      = 'phase-0';
    elLabel.style.display        = '';
    elFinish.style.display       = 'none';
    elLabel.textContent          = 'スタートボタンを押してね';
    elTimer.textContent          = fmt(PHASES[0].minutes * 60);
    elCircleProg.style.strokeDashoffset = 0;
    elTimer.style.display        = dispMode === 'number' ? 'block' : 'none';
    elCircleWrap.style.display   = 'none';
    elSecretIcon.style.display   = 'none';
    elStart.style.display        = 'inline-block';
    elPause.style.display        = 'none';
    elPause.textContent          = '⏸ 一時停止';
    elReset.style.display        = 'none';
    elBtnSetting.style.display   = 'inline-block';
    elBtnSavedList.style.display = 'inline-block';
  }

  // ══════════════════════════════════════════════
  //  設定画面
  // ══════════════════════════════════════════════
  function buildPresetBtns() {
    const wrap = document.getElementById('preset-btns');
    wrap.innerHTML = '';
    PRESETS.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn' + (p.id === activePresetId ? ' active' : '');
      btn.textContent = p.label;
      btn.onclick = () => applyPreset(p.id);
      wrap.appendChild(btn);
    });
  }

  function applyPreset(id) {
    const preset = PRESETS.find(p => p.id === id);
    if (!preset) return;
    activePresetId = id;
    PHASES = preset.phases.map(p => ({ ...p }));
    document.getElementById('s-btn-label').value  = preset.btnLabel;
    document.getElementById('s-finish-msg').value = preset.finishMsg;
    renderPhaseList();
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent === preset.label);
    });
  }

  function openSetting() {
    document.getElementById('s-btn-label').value  = startBtnLabel;
    document.getElementById('s-finish-msg').value = finishMsg;
    document.querySelector(`input[name="disp-mode"][value="${dispMode}"]`).checked  = true;
    document.querySelector(`input[name="sound-mode"][value="${soundMode}"]`).checked = true;
    buildPresetBtns();
    renderPhaseList();
    elTimerScreen.style.display   = 'none';
    elSettingScreen.style.display = 'block';
    document.body.className       = 'setting';
  }

  function closeSetting() {
    elSettingScreen.style.display = 'none';
    elTimerScreen.style.display   = 'block';
    document.body.className       = 'phase-0';
  }

  function renderPhaseList() {
    const list = document.getElementById('phase-list');
    list.innerHTML = '';
    PHASES.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'phase-row';
      row.innerHTML = `
        <span class="phase-num">${i + 1}.</span>
        <input type="text"   class="p-label" value="${escHtml(p.label)}" placeholder="表示テキスト">
        <input type="number" class="p-min"   value="${p.minutes}" min="1" max="999">
        <span class="unit">分</span>
        <button class="btn-delete" onclick="deletePhaseRow(${i})"
          ${PHASES.length === 1 ? 'disabled style="opacity:0.3"' : ''}>✕</button>
      `;
      list.appendChild(row);
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function syncPhasesFromForm() {
    document.querySelectorAll('#phase-list .phase-row').forEach((row, i) => {
      PHASES[i].label   = row.querySelector('.p-label').value.trim() || PHASES[i].label;
      PHASES[i].minutes = parseInt(row.querySelector('.p-min').value) || 1;
    });
  }

  function addPhaseRow() {
    syncPhasesFromForm();
    if (PHASES.length >= 10) { alert('フェーズは最大10個までです'); return; }
    PHASES.push({ label: '新しいフェーズ…', minutes: 5 });
    renderPhaseList();
  }

  function deletePhaseRow(index) {
    syncPhasesFromForm();
    if (PHASES.length <= 1) return;
    PHASES.splice(index, 1);
    renderPhaseList();
  }

  function saveSetting() {
    syncPhasesFromForm();
    startBtnLabel = document.getElementById('s-btn-label').value.trim() || '▶ スタート';
    finishMsg     = document.getElementById('s-finish-msg').value.trim() || 'おわり！';
    dispMode      = document.querySelector('input[name="disp-mode"]:checked').value;
    soundMode     = document.querySelector('input[name="sound-mode"]:checked').value;
    elStart.textContent   = startBtnLabel;
    elTimer.textContent   = fmt(PHASES[0].minutes * 60);
    elTimer.style.display = dispMode === 'number' ? 'block' : 'none';
    closeSetting();
  }

  // ══════════════════════════════════════════════
  //  名前をつけて保存（自分用に保存）
  // ══════════════════════════════════════════════
  function openSaveDialog() {
    syncPhasesFromForm();
    document.getElementById('save-name-input').value = '';
    document.getElementById('save-dialog').style.display = 'flex';
    document.getElementById('save-name-input').focus();
  }

  function closeSaveDialog() {
    document.getElementById('save-dialog').style.display = 'none';
  }

  function collectCurrentSetting() {
    return {
      btnLabel:  document.getElementById('s-btn-label').value.trim() || '▶ スタート',
      finishMsg: document.getElementById('s-finish-msg').value.trim() || 'おわり！',
      dispMode:  document.querySelector('input[name="disp-mode"]:checked').value,
      soundMode: document.querySelector('input[name="sound-mode"]:checked').value,
      phases:    PHASES.map(p => ({ label: p.label, minutes: p.minutes })),
    };
  }

  function confirmSaveAs() {
    const name = document.getElementById('save-name-input').value.trim();
    if (!name) { alert('名前を入力してください'); return; }

    const existIndex = myTimers.findIndex(t => t.name === name);
    if (existIndex >= 0) {
      if (!confirm('「' + name + '」はすでにあります。上書きしますか？')) return;
      myTimers.splice(existIndex, 1);
    }

    const setting = collectCurrentSetting();
    setting.name    = name;
    setting.savedAt = new Date().toLocaleString('ja-JP');

    myTimers.push(setting);

    saveMyTimers(function() {
      closeSaveDialog();
      alert('「' + name + '」を自分用に保存しました！');
    });
  }

  document.getElementById('save-name-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') confirmSaveAs();
  });

  // ══════════════════════════════════════════════
  //  みんな用に公開
  // ══════════════════════════════════════════════
  function openPublishDialog(index) {
    publishIndex = index;
    const t = myTimers[index];
    document.getElementById('publish-msg').textContent =
      '「' + t.name + '」をみんな用に公開しますか？\nURLを知っている人なら誰でも使えるようになります。';
    document.getElementById('publish-dialog').style.display = 'flex';
  }

  function closePublishDialog() {
    document.getElementById('publish-dialog').style.display = 'none';
    publishIndex = -1;
  }

  function confirmPublish() {
    if (publishIndex < 0) return;
    const t = myTimers[publishIndex];

    // 同名チェック
    const existIndex = sharedTimers.findIndex(s => s.name === t.name);
    if (existIndex >= 0) {
      sharedTimers.splice(existIndex, 1);
    }

    // コピーしてみんな用に追加
    const copy = JSON.parse(JSON.stringify(t));
    copy.savedAt = new Date().toLocaleString('ja-JP');
    sharedTimers.push(copy);

    saveSharedTimers(function() {
      closePublishDialog();
      alert('「' + t.name + '」をみんな用に公開しました！');
      // タブをみんな用に切り替えて表示
      switchTab('shared');
    });
  }

  // ══════════════════════════════════════════════
  //  保存タイマー一覧
  // ══════════════════════════════════════════════
  function openSavedList() {
    // 最新データを読み込んでから表示
    elTimerScreen.style.display = 'none';
    elSavedScreen.style.display = 'block';
    document.body.className     = 'setting';
    elSavedList.innerHTML       = '<div class="loading-msg">読み込み中...</div>';

    loadSharedTimers(function() {
      loadMyTimers(function() {
        renderSavedList();
      });
    });
  }

  function closeSavedList() {
    elSavedScreen.style.display = 'none';
    elTimerScreen.style.display = 'block';
    document.body.className     = 'phase-0';
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelector('.tab-btn.tab-shared').classList.toggle('active', tab === 'shared');
    document.querySelector('.tab-btn.tab-mine').classList.toggle('active', tab === 'mine');
    renderSavedList();
  }

  function renderSavedList() {
    const list    = currentTab === 'shared' ? sharedTimers : myTimers;
    const isMine  = currentTab === 'mine';

    elSavedList.innerHTML = '';

    if (list.length === 0) {
      if (isMine) {
        elSavedList.innerHTML = '<div class="saved-empty">まだ自分用のタイマーはありません。<br>⚙️ カスタム設定 →「名前をつけて保存」<br>で作れます。</div>';
      } else {
        elSavedList.innerHTML = '<div class="saved-empty">まだみんな用のタイマーはありません。<br>自分用に保存してから<br>「みんな用に公開」できます。</div>';
      }
      return;
    }

    list.forEach((t, i) => {
      const totalMin    = t.phases.reduce((sum, p) => sum + p.minutes, 0);
      const phaseNames  = t.phases.map(p => p.label).join(' → ');

      const item = document.createElement('div');
      item.className = 'saved-item';

      let btnsHtml = '<button class="btn-load" onclick="loadSavedTimer(\'' + currentTab + '\',' + i + ')">使う</button>';

      if (isMine) {
        // 自分用：公開ボタンと削除ボタン
        btnsHtml += '<button class="btn-publish" onclick="openPublishDialog(' + i + ')">🌐 公開</button>';
        btnsHtml += '<button class="btn-del-saved" onclick="deleteSavedTimer(\'' + currentTab + '\',' + i + ')">削除</button>';
      } else {
        // みんな用：削除ボタン
        btnsHtml += '<button class="btn-del-saved" onclick="deleteSavedTimer(\'' + currentTab + '\',' + i + ')">削除</button>';
      }

      item.innerHTML = `
        <div class="saved-item-info" onclick="loadSavedTimer('${currentTab}',${i})">
          <div class="saved-item-name">${escHtml(t.name)}</div>
          <div class="saved-item-detail">
            ${t.phases.length}フェーズ ・ 合計${totalMin}分<br>
            ${escHtml(phaseNames)}
          </div>
        </div>
        <div class="saved-item-btns">
          ${btnsHtml}
        </div>
      `;
      elSavedList.appendChild(item);
    });
  }

  function loadSavedTimer(tab, index) {
    const list = tab === 'shared' ? sharedTimers : myTimers;
    const t = list[index];
    if (!t) return;

    PHASES        = t.phases.map(p => ({ ...p }));
    startBtnLabel = t.btnLabel;
    finishMsg     = t.finishMsg;
    dispMode      = t.dispMode;
    soundMode     = t.soundMode;

    elStart.textContent   = startBtnLabel;
    elTimer.textContent   = fmt(PHASES[0].minutes * 60);
    elTimer.style.display = dispMode === 'number' ? 'block' : 'none';
    elLabel.textContent   = '「' + t.name + '」を読み込みました';

    closeSavedList();
  }

  function deleteSavedTimer(tab, index) {
    const list = tab === 'shared' ? sharedTimers : myTimers;
    const name = list[index].name;
    if (!confirm('「' + name + '」を削除しますか？')) return;
    list.splice(index, 1);

    const saveFn = tab === 'shared' ? saveSharedTimers : saveMyTimers;
    saveFn(function() {
      renderSavedList();
    });
  }
</script>

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}
if('serviceWorker' in navigator && location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
</script>
